<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#101a33"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1679d4"/><stop offset="1" stop-color="#193a82"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c9a88"/><stop offset="1" stop-color="#075b62"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6edbff"/></marker>
</defs>
<rect width="1800" height="1120" fill="url(#bg)"/>
<circle cx="900" cy="520" r="400" fill="none" stroke="#144174" stroke-width="2" opacity=".22"/>
<text x="900" y="70" fill="#f4f8ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">SHAH TUNNEL 1.7.0 — NETWORK FLOW</text>
<text x="900" y="113" fill="#65ccff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="22" text-anchor="middle">Four TCP transports plus an independent QUIC/UDP path</text>
<text x="900" y="148" fill="#a8bdd8" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="18" text-anchor="middle">Agent initiates the outbound tunnel to Hub; user traffic is forwarded Hub → Agent → target</text>
<rect x="60" y="225" width="230" height="110" rx="22" fill="#182b45" stroke="#4886bf" stroke-width="3"/><text x="175" y="290" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">PUBLIC USER</text><text x="175" y="332" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">TCP</text><rect x="1510" y="225" width="230" height="110" rx="22" fill="#172b3d" stroke="#3e9f91" stroke-width="3"/><text x="1625" y="290" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">LOCAL TARGET</text><text x="1625" y="332" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Connects to local target services</text><rect x="345" y="210" width="325" height="190" rx="22" fill="url(#blue)" stroke="#56b8ff" stroke-width="3"/><text x="507" y="275" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">HUB — PUBLIC SERVER</text><text x="507" y="317" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Public TCP mappings + tunnel control</text><text x="507" y="359" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">TLS control + public port map</text><rect x="1130" y="210" width="325" height="190" rx="22" fill="url(#green)" stroke="#49d4b4" stroke-width="3"/><text x="1292" y="275" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">AGENT — REMOTE SERVER</text><text x="1292" y="317" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Connects to local target services</text><text x="1292" y="359" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">12 independent lanes</text><path d="M290 280 H342" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M670 310 H900 H1128" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M1455 310 H1508" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><rect x="285" y="465" width="1230" height="360" rx="28" fill="#0b1629" stroke="#284668" stroke-width="2"/><text x="900" y="510" fill="#f4f8ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="27" font-weight="bold" text-anchor="middle">FOUR TCP TRANSPORTS</text><rect x="330" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="435" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">TCP/TLS</text><rect x="562" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="667" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">WebSocket/TLS</text><rect x="794" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="899" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">HTTP/2 CONNECT</text><rect x="1026" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="1131" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">HTTP/1.1 CONNECT</text><path d="M900 606 V632" stroke="#6edbff" stroke-width="4" marker-end="url(#arr)"/><rect x="330" y="645" width="1140" height="70" rx="14" fill="#102b3d" stroke="#34b8cf" stroke-width="2"/><text x="900" y="688" fill="#b9f0ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="20" text-anchor="middle">INDEPENDENT Hysteria 2 over QUIC/UDP + Salamander</text><rect x="330" y="735" width="1140" height="60" rx="14" fill="#102b2a" stroke="#1db99f" stroke-width="2"/><text x="900" y="773" fill="#b9ffec" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="20" text-anchor="middle">Inside every path: TLS 1.3 + 256-bit token + certificate pinning</text><rect x="100" y="870" width="500" height="90" rx="18" fill="#172943" stroke="#e3b35a" stroke-width="2"/><text x="350" y="904" fill="#ffd987" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">ACL: only 127.0.0.1 control port is allowed; all other destinations are rejected</text><rect x="650" y="870" width="500" height="90" rx="18" fill="#173a37" stroke="#38c8a8" stroke-width="2"/><text x="900" y="904" fill="#b5ffe6" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">OPTION 8: adaptive selection across all five paths</text><text x="900" y="938" fill="#d4e9e1" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="16" text-anchor="middle">5-second heartbeat; silent-path timeout at 20 seconds</text><rect x="1200" y="870" width="500" height="90" rx="18" fill="#3a2029" stroke="#d46c78" stroke-width="2"/><text x="1450" y="918" fill="#ffd4d7" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" text-anchor="middle">LIMIT: cannot bypass blocked UDP, all Hub IPs, or a total upstream outage</text><text x="900" y="1040" fill="#6d8eaf" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="18" text-anchor="middle">SHAH TUNNEL · VERSION 1.7.0</text></svg>