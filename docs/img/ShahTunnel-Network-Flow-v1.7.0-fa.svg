<rect width="1800" height="1120" fill="url(#bg)"/>
<circle cx="900" cy="520" r="400" fill="none" stroke="#144174" stroke-width="2" opacity=".22"/>
<text x="900" y="70" fill="#f4f8ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">جریان شبکه شاه‌تونل ۱.۷.۰</text>
<text x="900" y="113" fill="#65ccff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="22" text-anchor="middle">چهار مسیر مبتنی بر TCP به‌علاوه یک مسیر مستقل QUIC/UDP</text>
<text x="900" y="148" fill="#a8bdd8" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="18" text-anchor="middle">مسیر ایجنت به هاب؛ دادهٔ کاربر از هاب به مقصد هدایت می‌شود</text>
<rect x="1510" y="225" width="230" height="110" rx="22" fill="#182b45" stroke="#4886bf" stroke-width="3"/><text x="1625" y="290" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">کاربر عمومی</text><text x="1625" y="332" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">TCP</text><rect x="55" y="225" width="225" height="110" rx="22" fill="#172b3d" stroke="#3e9f91" stroke-width="3"/><text x="167" y="290" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">سرویس مقصد</text><text x="167" y="332" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">دسترسی به سرویس‌های محلی</text><rect x="1130" y="210" width="325" height="190" rx="22" fill="url(#blue)" stroke="#56b8ff" stroke-width="3"/><text x="1292" y="275" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">هاب — سرور ایران</text><text x="1292" y="317" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">درگاه‌های عمومی TCP و کنترل مسیر</text><text x="1292" y="359" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">کنترل TLS و نگاشت درگاه عمومی</text><rect x="345" y="210" width="325" height="190" rx="22" fill="url(#green)" stroke="#49d4b4" stroke-width="3"/><text x="507" y="275" fill="#ffffff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ایجنت — سرور مقصد</text><text x="507" y="317" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">دسترسی به سرویس‌های محلی</text><text x="507" y="359" fill="#c7def5" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">۱۲ کانال مستقل</text><path d="M1510 280 H1458" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M1130 310 H900 H670" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M345 310 H280" stroke="#6edbff" stroke-width="6" fill="none" marker-end="url(#arr)"/><rect x="285" y="465" width="1230" height="360" rx="28" fill="#0b1629" stroke="#284668" stroke-width="2"/><text x="900" y="510" fill="#f4f8ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="27" font-weight="bold" text-anchor="middle">چهار مسیر انتقال TCP</text><rect x="330" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="435" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">TCP/TLS</text><rect x="562" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="667" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">WebSocket/TLS</text><rect x="794" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="899" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">HTTP/2 CONNECT</text><rect x="1026" y="540" width="210" height="58" rx="14" fill="#152d4b" stroke="#3476af" stroke-width="2"/><text x="1131" y="577" fill="#d9edff" font-family="DejaVu Sans,Amiri,Noto Naskh Arabic,sans-serif" font-size="17" text-anchor="middle">HTTP/1.1 CONNECT</text><path d="M900 606 V632" stroke="#6edbff" stroke-width="4" marker-end="url(#arr)"/><rect x="330" y="645" width="1140" height="70" rx="14" fill="#102b3d" stroke="#34b8cf" stroke-width="2"/><text x="900" y="688" fill="#b9f0ff" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="20" text-anchor="middle">مسیر مستقل Hysteria 2 روی QUIC/UDP + Salamander</text><rect x="330" y="735" width="1140" height="60" rx="14" fill="#102b2a" stroke="#1db99f" stroke-width="2"/><text x="900" y="773" fill="#b9ffec" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="20" text-anchor="middle">درون همه مسیرها: TLS 1.3 + توکن ۲۵۶ بیتی + تثبیت اثرانگشت گواهی</text><rect x="100" y="870" width="500" height="90" rx="18" fill="#172943" stroke="#e3b35a" stroke-width="2"/><text x="350" y="904" fill="#ffd987" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">ACL: فقط اتصال به 127.0.0.1 و درگاه کنترل مجاز است؛ سایر مقصدها رد می‌شوند</text><rect x="650" y="870" width="500" height="90" rx="18" fill="#173a37" stroke="#38c8a8" stroke-width="2"/><text x="900" y="904" fill="#b5ffe6" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">گزینه ۸: انتخاب خودکار و جابه‌جایی میان پنج مسیر</text><text x="900" y="938" fill="#d4e9e1" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="16" text-anchor="middle">Heartbeat هر ۵ ثانیه؛ تشخیص بی‌پاسخی پس از ۲۰ ثانیه</text><rect x="1200" y="870" width="500" height="90" rx="18" fill="#3a2029" stroke="#d46c78" stroke-width="2"/><text x="1450" y="918" fill="#ffd4d7" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="17" text-anchor="middle">محدودیت: مسدودشدن UDP، تمام IPها یا قطع کامل بالادست را دور نمی‌زند</text><text x="900" y="1040" fill="#6d8eaf" font-family="Amiri, Noto Naskh Arabic, Tahoma, sans-serif" font-size="18" text-anchor="middle">شاه‌تونل · نسخهٔ ۱.۷.۰</text></svg>